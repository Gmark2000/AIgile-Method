name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version type to bump (patch, minor, major)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Install dependencies (if any)
        run: npm install --ignore-scripts
      
      - name: Validate package
        run: npm run validate
      
      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} -m "chore: release v%s"
      
      - name: Push version changes (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: git push --follow-tags
      
      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          release_name: Release v${{ steps.package-version.outputs.version }}
          body: |
            ## AIgile Method v${{ steps.package-version.outputs.version }}
            
            Install with:
            ```bash
            npx @mark-gozner/aigile-method install
            ```
            
            Or globally:
            ```bash
            npm install -g @mark-gozner/aigile-method
            aigile install
            ```
            
            See [CHANGELOG.md](https://github.com/mark-gozner/aigile-method/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
